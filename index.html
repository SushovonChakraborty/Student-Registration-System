<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Section -->
  <header>
    <h1>Student Registration System</h1>
    <p>Register students, view their records, edit or delete details, and keep data safe even after refresh.</p>
  </header>

  <!-- Registration Form -->
  <section class="form-section">
    <h2>Register Student</h2>
    <form id="studentForm">
      <label>Student Name:</label>
      <input type="text" id="name" placeholder="Enter name" required>

      <label>Student ID:</label>
      <input type="number" id="studentId" placeholder="Enter ID" required>

      <label>Email:</label>
      <input type="email" id="email" placeholder="Enter email" required>

      <label>Contact Number:</label>
      <input type="tel" id="contact" placeholder="Enter contact number" required>

      <button type="submit">Add Student</button>
    </form>
  </section>

  <!-- Display Section -->
  <section class="display-section">
    <h2>Registered Students</h2>
    <table id="studentTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>ID</th>
          <th>Email</th>
          <th>Contact</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Records will appear here -->
      </tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
